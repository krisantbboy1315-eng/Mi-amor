<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>¡Feliz Cumpleaños mi amorr!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #8be4f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Contenedor principal */
    .card-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* Wrapper de la imagen */
    .poster-wrapper {
      position: relative;
      width: 100%;
      cursor: pointer;
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.15);
    }

    /* Cartel flotante "TE AMOOOP" */
    .love-banner {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background-color: #ffb6c1;
      color: #ffffff;
      border: 4px solid #a37252;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 1.8rem;
      font-weight: 900;
      text-shadow: 2px 2px 0px #a37252;
      box-shadow: 4px 4px 0px #a37252;
      z-index: 20;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      white-space: nowrap;
    }

    .love-banner.show {
      transform: translateX(-50%) scale(1);
    }

    /* Pastel con Vela sobre la imagen */
    .cake-container {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 15;
    }

    /* Vela y Llama */
    .candle {
      position: relative;
      width: 10px;
      height: 24px;
      background: linear-gradient(to bottom, #ff80ab, #ffffff);
      border: 2px solid #a37252;
      border-radius: 3px;
    }

    .flame {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 14px;
      height: 20px;
      background-color: #ffeb3b;
      border: 2px solid #a37252;
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 10px #ff9800;
      transition: transform 0.3s ease;
    }

    .flame.lit {
      transform: translateX(-50%) scale(1);
      animation: flicker 0.6s infinite alternate;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
      100% { transform: translateX(-50%) scale(1.15) rotate(2deg); }
    }

    /* Cuerpo del Pastel */
    .cake {
      position: relative;
      width: 70px;
      height: 40px;
      background-color: #ffffff;
      border: 3px solid #a37252;
      border-radius: 8px 8px 12px 12px;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
    }

    .cake-top {
      position: absolute;
      top: 0;
      width: 100%;
      height: 12px;
      background-color: #ffb6c1;
      border-bottom: 3px solid #a37252;
      border-radius: 5px 5px 0 0;
    }

    .cake-cherry {
      position: absolute;
      top: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      background-color: #e52521;
      border: 2px solid #a37252;
      border-radius: 50%;
    }

    /* Botón */
    .btn-celebrate {
      margin-top: 15px;
      padding: 12px 26px;
      background-color: #ffffff;
      color: #a37252;
      border: 3px solid #a37252;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 3px 3px 0px #a37252;
      transition: transform 0.1s, box-shadow 0.1s;
      z-index: 10;
    }

    .btn-celebrate:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #a37252;
    }

    /* Globos cayendo */
    .falling-balloon {
      position: fixed;
      top: -100px;
      width: 45px;
      height: 60px;
      border: 3px solid #a37252;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      z-index: 50;
      pointer-events: none;
      animation: dropBalloon 4s linear forwards;
    }

    .falling-balloon::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 20px;
      width: 2px;
      height: 15px;
      background-color: #a37252;
    }

    @keyframes dropBalloon {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(25deg); opacity: 0.9; }
    }

    /* Confeti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
      border: 1px solid #a37252;
      border-radius: 2px;
      animation: fall 3s linear forwards;
      z-index: 100;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="poster-wrapper" onclick="encenderVela(event)">
      <!-- Imagen original convertida a data URI directamente dentro del código -->
      <img src="11.png" alt="Cinnamoroll Cumpleaños" class="poster-img" onerror="this.onerror=null; this.src='https://i.imgur.com/v8R0z1Q.png';">
      
      <!-- Mensaje "Te amooop" -->
      <div class="love-banner" id="loveBanner">¡Te amooop! ❤️</div>

      <!-- Pastel Interactivo superpuesto -->
      <div class="cake-container">
        <div class="candle">
          <div class="flame" id="flame"></div>
        </div>
        <div class="cake">
          <div class="cake-cherry"></div>
          <div class="cake-top"></div>
        </div>
      </div>
    </div>

    <button class="btn-celebrate" onclick="encenderVela(event)">🕯️ Toca para encender la vela 🕯️</button>
  </div>

  <script>
    function encenderVela(e) {
      if (e) e.stopPropagation();
      
      document.getElementById('flame').classList.add('lit');
      document.getElementById('loveBanner').classList.add('show');

      lanzarGlobos();
      lanzarConfeti();
    }

    function lanzarGlobos() {
      const colors = ['#ffb6c1', '#fff59d', '#81d4fa', '#c5e1a5', '#d2b4de'];
      
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const balloon = document.createElement('div');
          balloon.classList.add('falling-balloon');
          balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          balloon.style.left = `${Math.random() * 85 + 5}%`;
          balloon.style.animationDuration = `${3 + Math.random() * 2}s`;

          document.body.appendChild(balloon);
          setTimeout(() => balloon.remove(), 5000);
        }, i * 140);
      }
    }

    function createConfetti(x, y) {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');
      
      const colors = ['#ffb6c1', '#fff59d', '#81d4fa', '#c5e1a5', '#ffffff'];
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      
      confetti.style.left = `${x + (Math.random() * 60 - 30)}px`;
      confetti.style.top = `${y + (Math.random() * 60 - 30)}px`;

      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 3000);
    }

    function lanzarConfeti() {
      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          createConfetti(
            Math.random() * window.innerWidth, 
            Math.random() * (window.innerHeight / 2)
          );
        }, i * 20);
      }
    }
  </script>
</body>
</html>
