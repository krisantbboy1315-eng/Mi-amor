<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>¡Feliz Cumpleaños Cinnamoroll!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1baee8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Contenedor principal */
    .card-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* Marco de la imagen original */
    .poster-wrapper {
      position: relative;
      width: 100%;
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.2);
    }

    /* Cartel flotante "TE AMOOOP" */
    .love-banner {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background-color: #ff80ab;
      color: #ffffff;
      border: 4px solid #000;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 1.8rem;
      font-weight: 900;
      text-shadow: 2px 2px 0px #000;
      box-shadow: 4px 4px 0px #000;
      z-index: 20;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .love-banner.show {
      transform: translateX(-50%) scale(1);
    }

    /* Pastel con Vela en la pata de Cinnamoroll */
    .cake-container {
      position: absolute;
      bottom: 8%;
      left: 45%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 15;
    }

    /* Vela y Llama */
    .candle {
      position: relative;
      width: 10px;
      height: 25px;
      background: linear-gradient(to bottom, #ff4081, #ffffff);
      border: 2px solid #000;
      border-radius: 3px;
    }

    .flame {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 14px;
      height: 20px;
      background-color: #ffeb3b;
      border: 2px solid #000;
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 10px #ff9800;
      transition: transform 0.3s ease;
      animation: flicker 0.6s infinite alternate;
    }

    .flame.lit {
      transform: translateX(-50%) scale(1);
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
      100% { transform: translateX(-50%) scale(1.1) rotate(2deg); }
    }

    /* Cuerpo del Pastel */
    .cake {
      position: relative;
      width: 75px;
      height: 45px;
      background-color: #ffffff;
      border: 3px solid #000;
      border-radius: 8px 8px 12px 12px;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
    }

    .cake-top {
      position: absolute;
      top: 0;
      width: 100%;
      height: 14px;
      background-color: #ff80ab;
      border-bottom: 3px solid #000;
      border-radius: 5px 5px 0 0;
    }

    .cake-cherry {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      background-color: #e52521;
      border: 2px solid #000;
      border-radius: 50%;
    }

    /* Botón decorativo */
    .btn-celebrate {
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #ffffff;
      color: #000;
      border: 3px solid #000;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 3px 3px 0px #000;
      transition: transform 0.1s, box-shadow 0.1s;
      z-index: 10;
    }

    .btn-celebrate:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }

    /* Globos cayendo */
    .falling-balloon {
      position: fixed;
      top: -100px;
      width: 50px;
      height: 65px;
      border: 3px solid #000;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      z-index: 50;
      pointer-events: none;
      animation: dropBalloon 4s linear forwards;
    }

    .falling-balloon::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 22px;
      width: 2px;
      height: 15px;
      background-color: #000;
    }

    @keyframes dropBalloon {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(20deg); opacity: 0.9; }
    }

    /* Confeti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
      border: 1px solid #000;
      border-radius: 2px;
      animation: fall 3s linear forwards;
      z-index: 100;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="poster-wrapper">
      <img src="cinamoroll.png" alt="¡Feliz cumpleaños mi chinita!" class="poster-img">
      
      <!-- Mensaje Te amo -->
      <div class="love-banner" id="loveBanner">¡Te amooop! ❤️</div>

      <!-- Pastel Interactivo -->
      <div class="cake-container" onclick="encenderVela(event)">
        <div class="candle">
          <div class="flame" id="flame"></div>
        </div>
        <div class="cake">
          <div class="cake-cherry"></div>
          <div class="cake-top"></div>
        </div>
      </div>
    </div>

    <button class="btn-celebrate" onclick="encenderVela(event)">🕯️ encender la vela 🕯️</button>
  </div>

  <script>
    let velaEncendida = false;

    function encenderVela(e) {
      if (e) e.stopPropagation();
      
      const flame = document.getElementById('flame');
      const loveBanner = document.getElementById('loveBanner');

      flame.classList.add('lit');
      loveBanner.classList.add('show');

      // Lanzar la lluvia de globos y confeti
      lanzarGlobos();
      lanzarConfeti();
    }

    function lanzarGlobos() {
      const colors = ['#e52521', '#ffda44', '#00a0e9', '#ff80ab', '#ab47bc', '#4caf50'];
      
      for (let i = 0; i < 18; i++) {
        setTimeout(() => {
          const balloon = document.createElement('div');
          balloon.classList.add('falling-balloon');
          balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          balloon.style.left = `${Math.random() * 85 + 5}%`;
          balloon.style.animationDuration = `${3 + Math.random() * 2}s`;

          document.body.appendChild(balloon);

          setTimeout(() => balloon.remove(), 5000);
        }, i * 150);
      }
    }

    function createConfetti(x, y) {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');
      
      const colors = ['#e52521', '#ffda44', '#00a0e9', '#ff80ab', '#ffffff'];
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      
      confetti.style.left = `${x + (Math.random() * 60 - 30)}px`;
      confetti.style.top = `${y + (Math.random() * 60 - 30)}px`;

      document.body.appendChild(confetti);

      setTimeout(() => confetti.remove(), 3000);
    }

    function lanzarConfeti() {
      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          createConfetti(
            Math.random() * window.innerWidth, 
            Math.random() * (window.innerHeight / 2)
          );
        }, i * 20);
      }
    }
  </script>
</body>
</html>
